[package]
name = "ticket_generator"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
axum = "0.7"
eframe = "0.29"
calamine = "0.26"
chrono = "0.4"
docx-rs = "0.4"
env_logger = "0.11"
log = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
umya-spreadsheet = "2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
thirtyfour = "0.33"
tokio = { version = "1.0", features = ["full"] }
